; =========================================================================
; PlatformIO Project Configuration File
; Entorno de compilación, enlace y despliegue para ESP32-C3 Super Mini
; Documentación oficial: https://docs.platformio.org/page/projectconf.html
; =========================================================================

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Tasa de baudios para el monitor serie UART/USB CDC
monitor_speed = 115200

; Velocidad de transferencia del cargador de arranque (bootloader)
upload_speed = 921600

; =========================================================================
; DIRECTIVAS CRÍTICAS DEL COMPILADOR (ESP32-C3 USB NATIVO)
; =========================================================================
; La arquitectura ESP32-C3 prescinde de un puente USB-UART dedicado (CP2102/CH340).
; Las siguientes banderas habilitan el soporte de CDC (Communication Device Class)
; sobre el controlador USB nativo durante la fase de arranque del firmware.
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Parámetros de temporización e interfaz de la memoria flash SPI (QIO a 80 MHz)
board_build.flash_mode = qio
board_build.f_flash = 80000000L
